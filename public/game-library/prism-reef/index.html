<!doctype html><html lang="en"><head><base href="/game-library/prism-reef/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><link rel="icon" href="data:,"><title>Prism Reef · Unity local review</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071325;touch-action:none;overscroll-behavior:none}body{display:flex;align-items:center;justify-content:center}#reef{position:relative;width:min(100vw,calc(100vh * 390 / 844));height:min(100vh,calc(100vw * 844 / 390));}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c2e6e7;font:18px system-ui;background:#0a1b31}#state-snapshot,#qa-recorder{display:none}</style></head><body><main id="reef" aria-label="Prism Reef touch game"><canvas id="unity-canvas" width="390" height="844" tabindex="0" aria-label="Game. Drag the lower shell to aim; hold still to charge; lift to spread."></canvas><div id="loading">Waking the reef… <span id="progress">0%</span></div></main><output id="state-snapshot" aria-hidden="true">{}</output><output id="qa-recorder" aria-hidden="true"></output><output id="input-events" style="display:none" aria-hidden="true">[]</output><output id="lifecycle-events" style="display:none" aria-hidden="true">[]</output><script>
var unityInstance=null;const canvas=document.getElementById('unity-canvas');const query=new URLSearchParams(location.search);let owner=null;const external=!(query.has('qa')&&query.get('input')==='engine');let lifecycle=[];let inputEvents=[];if(query.has('qa')){for(const kind of ['pointerdown','pointermove','pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(kind,e=>{inputEvents.push({kind:kind,pointerType:e.pointerType,id:e.pointerId,isPrimary:e.isPrimary,trusted:e.isTrusted,x:e.clientX,y:e.clientY,at:performance.now(),owner:owner});if(inputEvents.length>500)inputEvents.shift();document.getElementById('input-events').textContent=JSON.stringify(inputEvents);},{capture:true});}
function send(kind,e){if(!unityInstance||!external)return;const r=canvas.getBoundingClientRect();unityInstance.SendMessage('ReefRoot','PointerPacket',[kind,(e.clientX-r.left)*390/r.width,(e.clientY-r.top)*844/r.height,e.pointerId].join(','));}
canvas.addEventListener('pointerdown',e=>{if(!external)return;e.preventDefault();if(owner!==null)return;owner=e.pointerId;canvas.setPointerCapture(owner);send('down',e);});
canvas.addEventListener('pointermove',e=>{if(!external)return;if(e.pointerId===owner){e.preventDefault();send('move',e);}});
canvas.addEventListener('pointerup',e=>{if(!external)return;if(e.pointerId===owner){send('up',e);owner=null;e.preventDefault();}});
canvas.addEventListener('pointercancel',e=>{if(!external)return;if(e.pointerId===owner){send('cancel',e);owner=null;}});
canvas.addEventListener('lostpointercapture',e=>{if(!external)return;if(e.pointerId===owner){send('cancel',e);owner=null;}});
function suspend(source){owner=null;lifecycle.push({source:source,at:Date.now(),visibility:document.visibilityState});document.getElementById('lifecycle-events').textContent=JSON.stringify(lifecycle);if(unityInstance)unityInstance.SendMessage('ReefRoot','Suspend','');}
document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend('visibility-hidden');});window.addEventListener('blur',()=>suspend('window-blur'));window.addEventListener('pagehide',()=>suspend('pagehide'));document.addEventListener('freeze',()=>suspend('freeze'));
function record(){const run=query.get('record');if(!run||!query.has('qa'))return;let output=document.getElementById('qa-recorder');try{const stream=canvas.captureStream(30);const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1400000});let chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{try{const response=await fetch('/__qa/record?run='+encodeURIComponent(run),{method:'POST',body:new Blob(chunks,{type:mime})});output.textContent=JSON.stringify(await response.json());}catch(e){output.textContent=JSON.stringify({error:String(e)})}stream.getTracks().forEach(t=>t.stop());};recorder.start(1000);output.textContent='recording';let stopped=false;const observer=new MutationObserver(()=>{try{const s=JSON.parse(document.getElementById('state-snapshot').textContent);if(!stopped&&['win','fail'].includes(s.phase)){stopped=true;setTimeout(()=>{recorder.stop();observer.disconnect()},1100)}}catch(e){}});observer.observe(document.getElementById('state-snapshot'),{childList:true});setTimeout(()=>{if(recorder.state==='recording'){recorder.stop();observer.disconnect()}},300000);}catch(e){output.textContent=JSON.stringify({error:String(e)})}}
const loader=document.createElement('script');loader.src='Build/build.loader.js';loader.onload=()=>{createUnityInstance(canvas,{dataUrl:'Build/build.data',frameworkUrl:'Build/build.framework.js',codeUrl:'Build/build.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'ArcaneForgeSandbox',productName:'Prism Reef',productVersion:'0.1.0',matchWebGLToCanvasSize:true,devicePixelRatio:1},p=>{document.getElementById('progress').textContent=Math.round(p*100)+'%'}).then(instance=>{unityInstance=instance;unityInstance.SendMessage('ReefRoot','SetExternalInput',external?'1':'0');document.getElementById('loading').remove();record();}).catch(e=>{document.getElementById('loading').textContent='Load failed: '+e;console.error(e)});};document.body.appendChild(loader);
</script></body></html>
