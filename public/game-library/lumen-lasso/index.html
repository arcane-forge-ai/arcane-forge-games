<!doctype html><html lang="en"><head><base href="/game-library/lumen-lasso/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Lumen Lasso · Arcane Forge</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030a10;color:#d9e8e8;font:17px system-ui}body{display:grid;place-items:center}#frame{position:relative;width:min(100vw,160vh);height:min(100vh,62.5vw);aspect-ratio:1.6}canvas{display:block;width:100%;height:100%;outline:none;background:#07121f}#loading{position:absolute;inset:0;display:grid;place-content:center;gap:22px;background:#07121f;text-align:center}h1{font-size:44px;color:#f0e3c4;letter-spacing:-1px}#track{height:5px;width:320px;background:#173139}#bar{height:100%;background:#82e8d9;width:0}#error{max-width:700px;color:#ff9184}</style></head><body><main id="frame"><canvas id="unity-canvas" width="1280" height="800" tabindex="0" aria-label="Lumen Lasso Unity WebGL game"></canvas><section id="loading"><div style="color:#c9a760;letter-spacing:4px;font-size:12px">ARCANE FORGE / ORBITAL RECOVERY</div><h1>Lumen Lasso</h1><div id="track"><div id="bar"></div></div><span>Preparing the relay field…</span><div id="error"></div></section></main><script>
const canvas=document.querySelector('canvas');const config={dataUrl:'Build/WebGL.data',frameworkUrl:'Build/WebGL.framework.js',codeUrl:'Build/WebGL.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'Arcane Forge',productName:'Lumen Lasso',productVersion:'0.1.0',showBanner:(m,t)=>{if(t==='error')document.querySelector('#error').textContent=m;else console.log(m)}};const loader=document.createElement('script');loader.src='Build/WebGL.loader.js';loader.onload=()=>createUnityInstance(canvas,config,p=>document.querySelector('#bar').style.width=p*100+'%').then(i=>{window.unityInstance=i;document.querySelector('#loading').remove();canvas.focus()}).catch(e=>document.querySelector('#error').textContent=String(e));document.body.appendChild(loader);window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
</script></body></html>
