<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071521">
<title>Tideglass Relay</title>
<style>@font-face{font-family:Dive;src:url(assets/dive.woff2) format("woff2");font-weight:700}@font-face{font-family:Dive;src:url(assets/dive-text.woff2) format("woff2");font-weight:400}@font-face{font-family:Plex;src:url(assets/plex.woff2) format("woff2");font-weight:700}</style>
<script>
if (location.pathname.endsWith('/tideglass-relay')) {
  const base = document.createElement('base');
  base.href = location.pathname + '/';
  document.head.append(base);
}
</script>
<style>
* { box-sizing:border-box }
html, body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#071521; color:#e9f7f7 }
main { display:flex; width:100%; height:100%; height:100dvh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); justify-content:center }
#stage { position:relative; width:min(100%, 630px); min-height:0; outline:0 }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-tap-highlight-color:transparent; outline:0 }
canvas:focus-visible { outline:2px solid #91efd6; outline-offset:-2px }
#load { position:absolute; inset:0; display:grid; place-content:center; font:700 clamp(22px,7vw,34px) system-ui; pointer-events:none }
#load[hidden] { display:none }
</style>
</head>
<body>
<main><div id="stage"><canvas id="game" tabindex="0" aria-label="Tideglass Relay. Use left and right to send, down to reserve, H for help, M for sound."></canvas><div id="load" role="status">Opening the dive console…</div></div></main>
<script src="game.js" defer></script>
</body>
</html>
