<!doctype html><html lang="en"><head><link rel="icon" type="image/png" href="icon.png"><base href="/game-library/stackline-foundry/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stackline Foundry</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09131b}#unity-canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f0d6ae;font:22px system-ui;background:#0d1924}#loading small{display:block;font-size:16px;color:#9cb7c7;margin-top:12px}#error{color:#ffa88d}</style></head><body><canvas id="unity-canvas" width="1440" height="900" tabindex="0"></canvas><div id="loading"><div>WARMING THE FOUNDRY…<small id="progress">Loading Unity</small><small id="error"></small></div></div><script src="Build/webgl.loader.js"></script><script>createUnityInstance(document.getElementById('unity-canvas'),{dataUrl:'Build/webgl.data',frameworkUrl:'Build/webgl.framework.js',codeUrl:'Build/webgl.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'Arcane Forge',productName:'Stackline Foundry',productVersion:'0.1.0'},p=>document.getElementById('progress').textContent=Math.round(p*100)+'%').then(u=>{window.unityInstance=u;document.getElementById('loading').remove();document.getElementById('unity-canvas').focus()}).catch(e=>{document.getElementById('error').textContent=e;console.error(e)})</script></body></html>
